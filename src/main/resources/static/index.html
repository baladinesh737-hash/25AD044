<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TicketDesk - Campus Movie Booking</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🎬 TicketDesk</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#shows">Shows</a>
        <a href="#booking">Book Ticket</a>
        <a href="#bookings">Bookings</a>
    </nav>
</header>


<section id="home" class="hero">

    <div class="hero-content">

        <h1>Campus Movie Show</h1>

        <p>
            Book your movie tickets easily with TicketDesk.
        </p>

        <a href="#shows" class="btn">
            View Shows
        </a>

    </div>

</section>


<section id="shows" class="section">

    <h2>Available Shows</h2>

    <div id="showsContainer" class="shows-container">

        <p>Loading shows...</p>

    </div>

</section>


<section id="booking" class="section booking-section">

    <h2>Book Your Ticket</h2>

    <form id="bookingForm">

        <label>Student ID</label>

        <input
                type="number"
                id="studentId"
                placeholder="Enter Student ID"
                required
        >

        <label>Show ID</label>

        <input
                type="number"
                id="showId"
                placeholder="Enter Show ID"
                required
        >

        <label>Seats</label>

        <input
                type="number"
                id="seatsBooked"
                min="1"
                placeholder="Number of seats"
                required
        >

        <button type="submit" class="btn">
            Book Ticket
        </button>

    </form>

    <div id="bookingMessage"></div>

</section>


<section id="bookings" class="section">

    <h2>All Bookings</h2>

    <button class="btn" onclick="loadBookings()">
        Refresh Bookings
    </button>

    <div id="bookingsContainer">

        <p>Click refresh to load bookings.</p>

    </div>

</section>


<footer>

    <p>
        © 2026 TicketDesk - Campus Movie Show Ticket Booking System
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
